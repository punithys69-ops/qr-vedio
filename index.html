<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Private Video</title>
  <style>
    /* Reset & Fullscreen Black Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    /* Video Player setup */
    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none; /* Prevents tapping/clicking to pause or interact */
      background-color: #000000;
    }

    /* Subtle Unmute Prompt Pill */
    .unmute-pill {
      position: absolute;
      bottom: max(32px, env(safe-area-inset-bottom, 32px));
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.3s ease, transform 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .unmute-pill:active {
      transform: scale(0.96);
    }

    /* Autoplay Blocked Fallback Overlay */
    .fallback-overlay {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .fallback-btn {
      background: #ffffff;
      color: #000000;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    /* Video End Screen Overlay */
    .end-screen {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .end-screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    .end-message {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video
      id="privateVideo"
      autoplay
      muted
      playsinline
      webkit-playsinline
      disablePictureInPicture
      disableRemotePlayback
      controlsList="nodownload nofullscreen noremoteplayback"
    >
      <source src="video.mp4" type="video/mp4" />
      <source src="vedio.mp4" type="video/mp4" />
    </video>

    <!-- Tap to unmute button if browser started muted -->
    <div id="unmutePill" class="unmute-pill" style="display: none;">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      Tap for sound
    </div>
  </div>

  <!-- Autoplay Blocked Fallback Screen -->
  <div id="fallbackOverlay" class="fallback-overlay">
    <button class="fallback-btn">Tap to Play Video</button>
  </div>

  <!-- Video Ended Screen -->
  <div id="endScreen" class="end-screen">
    <div class="end-message">Thank you ❤️</div>
  </div>

  <script>
    (function () {
      const video = document.getElementById('privateVideo');
      const unmutePill = document.getElementById('unmutePill');
      const fallbackOverlay = document.getElementById('fallbackOverlay');
      const endScreen = document.getElementById('endScreen');

      // 1. Disable context menu & drag events
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

      // 2. Configure Video API properties
      if ('disablePictureInPicture' in video) {
        video.disablePictureInPicture = true;
      }
      if ('disableRemotePlayback' in video) {
        video.disableRemotePlayback = true;
      }

      // 3. Autoplay Initialization
      function initAutoplay() {
        video.muted = true;
        const playPromise = video.play();

        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              // Autoplay succeeded muted. Show unmute option.
              unmutePill.style.display = 'flex';
            })
            .catch(() => {
              // Autoplay blocked by browser policy. Show tap-to-play overlay.
              fallbackOverlay.style.display = 'flex';
            });
        }
      }

      // Unmute handler on user interaction
      function enableSound() {
        video.muted = false;
        unmutePill.style.display = 'none';
      }

      unmutePill.addEventListener('click', (e) => {
        e.stopPropagation();
        enableSound();
      });

      // Tap to play overlay handler if autoplay was blocked
      fallbackOverlay.addEventListener('click', () => {
        fallbackOverlay.style.display = 'none';
        video.muted = false;
        video.play().catch(() => {
          video.muted = true;
          video.play();
        });
      });

      // Also unmute if user taps anywhere on screen while unmute pill is visible
      document.body.addEventListener('click', () => {
        if (video.muted && !video.paused) {
          enableSound();
        }
      });

      // 4. Handle Video Completion (End Event)
      video.addEventListener('ended', () => {
        // Show "Thank you ❤️" screen
        endScreen.classList.add('active');

        // Wait a moment then attempt to navigate back or close window
        setTimeout(() => {
          if (window.history.length > 1) {
            window.history.back();
          } else {
            window.close();
          }
        }, 2500);
      });

      // Execute on load
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initAutoplay);
      } else {
        initAutoplay();
      }
    })();
  </script>
</body>
</html>
